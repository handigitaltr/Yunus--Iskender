<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yunus İskender — Kebap &amp; Lahmacun</title>
<meta name="theme-color" content="#0C2A1F">
<meta name="description" content="Yunus İskender Kebap & Lahmacun — 1995'ten beri değişmeyen lezzet. Dijital menü.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Lobster+Two:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{
  --forest-900:#071C15;
  --forest-800:#0C2A1F;
  --forest-700:#103528;
  --line:rgba(242,183,5,.22);
  --gold:#F2B705;
  --gold-soft:#FFD45E;
  --cream:#F6F2E6;
  --muted:#9DBBA9;
  --danger:#E2574C;
  --radius:16px;
  --strip-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--forest-800);
  color:var(--cream);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(242,183,5,.10), transparent 60%),
    radial-gradient(80% 50% at 100% 100%, rgba(23,69,47,.9), transparent 70%);
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- AÇILIŞ ANİMASYONU ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--forest-900);display:grid;place-items:center;overflow:hidden}
#intro .glow{
  position:absolute;width:140vmax;height:140vmax;border-radius:50%;
  background:radial-gradient(circle, rgba(242,183,5,.16), transparent 55%);
  animation:glowIn .85s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes glowIn{from{transform:scale(.2);opacity:0}60%{opacity:1}to{transform:scale(1);opacity:.85}}
#intro .stage{position:relative;display:grid;justify-items:center;gap:18px;padding:0 24px;width:min(560px,92vw)}
#intro .rule{height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);animation:ruleIn .35s .05s cubic-bezier(.2,.9,.2,1) forwards}
#intro .rule.b{animation-delay:.12s}
@keyframes ruleIn{to{transform:scaleX(1)}}
#intro .logo{width:100%;opacity:0;filter:blur(14px);transform:scale(.9);animation:logoIn .45s .18s cubic-bezier(.2,.85,.25,1) forwards}
@keyframes logoIn{to{opacity:1;filter:blur(0);transform:scale(1)}}
#intro .shine{
  position:absolute;top:-10%;bottom:-10%;width:58%;filter:blur(6px);
  background:linear-gradient(100deg,transparent 8%,rgba(255,255,255,.10) 32%,rgba(255,255,255,.34) 50%,rgba(255,255,255,.10) 68%,transparent 92%);
  transform:translateX(-160%) skewX(-14deg);animation:shine .45s .5s ease-in-out forwards;mix-blend-mode:screen;
}
@keyframes shine{to{transform:translateX(320%) skewX(-14deg)}}
#intro .est{font-family:'Lobster Two',cursive;font-style:italic;color:var(--gold-soft);letter-spacing:.4px;font-size:15px;opacity:0;animation:fadeUp .28s .55s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#intro.done{animation:curtain .5s 0s cubic-bezier(.7,0,.3,1) forwards}
@keyframes curtain{to{transform:translateY(-102%);opacity:.4;visibility:hidden}}

/* ---------- ÜST BAŞLIK ---------- */
.top{position:relative;z-index:1;padding:26px 20px 14px;text-align:center}
.top .brand{width:min(430px,86vw);margin:0 auto;filter:drop-shadow(0 10px 26px rgba(0,0,0,.45))}
.top .sub{margin:14px auto 0;display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top .sub i{display:block;width:26px;height:1px;background:var(--line)}

/* ---------- KATEGORİ ŞERİDİ ---------- */
.strip{
  position:sticky;top:0;z-index:60;
  background:rgba(7,28,21,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(242,183,5,.14);border-bottom:1px solid rgba(242,183,5,.14);
}
.strip-in{display:flex;gap:8px;overflow-x:auto;padding:11px 14px;scrollbar-width:none;scroll-behavior:smooth}
.strip-in::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:999px;border:1px solid rgba(157,187,169,.28);
  color:var(--cream);font-size:13px;font-weight:600;white-space:nowrap;
  transition:background .25s,border-color .25s,color .25s,transform .25s;
}
.chip svg{width:19px;height:19px;flex:0 0 auto;color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#20180B;transform:translateY(-1px)}
.chip.on svg{color:#20180B}

/* ---------- MENÜ ---------- */
main{position:relative;z-index:1;padding:0 16px 92px;max-width:760px;margin:0 auto}
.featured{padding:22px 0 6px}
.feat-label{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--gold);font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:700}
.feat-label i{flex:1;height:1px;background:var(--line)}
.feat-grid{display:grid;gap:12px}
.feat{
  display:flex;gap:14px;align-items:center;padding:12px;border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(242,183,5,.13),rgba(242,183,5,.05));
  border:1px solid rgba(242,183,5,.34);
}
.feat .ph{width:88px;height:88px;flex:0 0 auto}
.feat .nm{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;letter-spacing:.4px;line-height:1.1}
.feat .ds{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.feat .pr{font-family:'Oswald',sans-serif;font-size:20px;color:var(--gold);font-weight:600;margin-top:7px}

section.cat{padding-top:34px;scroll-margin-top:calc(var(--strip-h) + 8px)}
.cat-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.cat-ico{width:46px;height:46px;flex:0 0 auto;display:grid;place-items:center;border-radius:14px;background:rgba(242,183,5,.12);border:1px solid rgba(242,183,5,.3);color:var(--gold)}
.cat-ico svg{width:28px;height:28px}
.cat-head h2{margin:0;font-family:'Oswald',sans-serif;font-size:25px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.cat-head .cnt{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:2px;font-weight:600}
.cat-rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:12px 0 8px}

.item{display:flex;gap:13px;align-items:center;padding:12px 4px;border-bottom:1px dashed rgba(157,187,169,.16)}
.item:last-of-type{border-bottom:0}
.ph{width:76px;height:76px;border-radius:13px;overflow:hidden;flex:0 0 auto;background:var(--forest-700);border:1px solid rgba(157,187,169,.2);display:grid;place-items:center;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.empty{color:rgba(157,187,169,.4)}
.ph.empty svg{width:32px;height:32px}
.ph.clickable{cursor:zoom-in}
.ph.clickable::after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(242,183,5,.35);opacity:0;transition:opacity .25s}
.ph.clickable:hover::after,.ph.clickable:focus::after{opacity:1}
.info{flex:1;min-width:0}
.row1{display:flex;align-items:baseline;gap:10px}
.nm{font-family:'Oswald',sans-serif;font-size:17.5px;font-weight:500;letter-spacing:.35px;line-height:1.15;flex:1}
.dots{flex:1;border-bottom:1px dotted rgba(157,187,169,.3);transform:translateY(-4px);min-width:8px}
.pr{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;color:var(--gold);white-space:nowrap}
.ds{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:5px}
.gr{display:inline-block;margin-top:7px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--gold-soft);background:rgba(242,183,5,.1);border:1px solid rgba(242,183,5,.24)}
.note{margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border-left:3px solid var(--gold);font-size:13px;line-height:1.6;color:#DDE9E0}
.note b{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.empty-cat{padding:16px 4px;color:var(--muted);font-size:13px}

footer{position:relative;z-index:1;text-align:center;padding:34px 20px 46px;border-top:1px solid rgba(157,187,169,.14);margin-top:40px}
footer .fest{font-family:'Lobster Two',cursive;font-style:italic;color:var(--gold-soft);font-size:17px}
footer .fsub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.admin-link{margin-top:18px;font-size:11.5px;color:rgba(157,187,169,.55);letter-spacing:.1em;padding:8px 14px;border-radius:999px;border:1px solid rgba(157,187,169,.2)}

/* ---------- BÜYÜK GÖRSEL ---------- */
#lb{position:fixed;inset:0;z-index:150;background:rgba(4,14,10,.94);backdrop-filter:blur(8px);display:none;place-items:center}
#lb.on{display:grid}
#lb .wrap{width:100%;height:100%;display:grid;place-items:center;padding:18px;animation:pop .28s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
#lb img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.6)}
#lb .cap{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;padding:0 70px;pointer-events:none}
#lb .cap .t{font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.4px}
#lb .cap .p{color:var(--gold);font-family:'Oswald',sans-serif;font-size:17px;margin-top:3px}
.lb-btn{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff}
.lb-btn:active{transform:scale(.94)}
#lbClose{top:calc(14px + env(safe-area-inset-top));right:14px}
#lbPrev{left:12px;top:50%;margin-top:-22px}
#lbNext{right:12px;top:50%;margin-top:-22px}
.lb-btn svg{width:22px;height:22px}

/* ---------- YÖNETİCİ PANELİ ---------- */
#panel{position:fixed;inset:0;z-index:170;background:var(--forest-900);display:none;flex-direction:column}
#panel.on{display:flex}
.p-top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid rgba(242,183,5,.18);background:var(--forest-800)}
.p-top h3{margin:0;font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.6px;flex:1;text-transform:uppercase}
.p-body{flex:1;overflow-y:auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.p-tabs{display:flex;gap:6px;padding:10px 16px;background:var(--forest-800);border-bottom:1px solid rgba(157,187,169,.14);overflow-x:auto;scrollbar-width:none}
.p-tabs::-webkit-scrollbar{display:none}
.p-tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid transparent}
.p-tab.on{background:rgba(242,183,5,.14);color:var(--gold);border-color:rgba(242,183,5,.35)}
.p-pane{animation:fadeUp .3s ease}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px}
.inp{width:100%;padding:13px 14px;border-radius:12px;font-size:15px;background:rgba(255,255,255,.05);border:1px solid rgba(157,187,169,.24);color:var(--cream)}
.inp:focus{border-color:var(--gold);outline:none}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cp{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:13px;text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(157,187,169,.2);font-size:11px;font-weight:600;line-height:1.25;color:var(--muted)}
.cp svg{width:26px;height:26px;color:var(--muted)}
.cp.on{background:rgba(242,183,5,.14);border-color:var(--gold);color:var(--cream)}
.cp.on svg{color:var(--gold)}

.drop{display:grid;place-items:center;gap:8px;padding:20px;border-radius:14px;text-align:center;border:1.5px dashed rgba(157,187,169,.35);background:rgba(255,255,255,.03);color:var(--muted);font-size:13px}
.drop svg{width:30px;height:30px;color:var(--gold)}
.prev{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(242,183,5,.3)}
.prev img{width:100%;max-height:230px;object-fit:cover}
.prev .rm{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center}
.prev .rm svg{width:16px;height:16px}

.btn{width:100%;padding:14px;border-radius:12px;font-weight:800;font-size:14.5px;letter-spacing:.06em;background:var(--gold);color:#20180B;transition:transform .15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;border:1px solid rgba(157,187,169,.3);color:var(--cream);font-weight:600}
.btn.dngr{background:transparent;border:1px solid rgba(226,87,76,.5);color:var(--danger)}

.adm-cat{margin-bottom:22px}
.adm-cat h4{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--gold-soft)}
.adm-cat h4 svg{width:20px;height:20px;color:var(--gold);flex:0 0 auto}
.adm-item{display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:7px}
.adm-item .th{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:var(--forest-700);display:grid;place-items:center;color:rgba(157,187,169,.4)}
.adm-item .th img{width:100%;height:100%;object-fit:cover}
.adm-item .th svg{width:20px;height:20px}
.adm-item .m{flex:1;min-width:0}
.adm-item .m b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-item .m span{font-size:12px;color:var(--gold)}
.adm-acts{display:flex;gap:5px;flex:0 0 auto}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--muted)}
.ib svg{width:16px;height:16px}
.ib.del{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:220;background:var(--gold);color:#20180B;padding:12px 20px;border-radius:999px;font-weight:700;font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.4);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.lock{display:grid;place-items:center;min-height:66vh;padding:20px}
.lock-in{width:min(340px,100%);text-align:center}
.lock-in .ico{width:62px;height:62px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:rgba(242,183,5,.12);border:1px solid rgba(242,183,5,.3);color:var(--gold)}
.lock-in .ico svg{width:28px;height:28px}
.lock-in h4{margin:0 0 6px;font-family:'Oswald',sans-serif;font-size:21px;letter-spacing:.6px}
.lock-in p{margin:0 0 20px;color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}

@media (max-width:380px){
  .ph{width:66px;height:66px}
  .nm{font-size:16.5px}
  .cat-head h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

/* ================= VERİ ================= */
const MENU_COLLECTION = 'menuProducts';

const DB = {
  async get(){
    let settingsSnap, productsSnap;

    settingsSnap = await db.collection('menuSettings').doc('main').get();

    try{
      productsSnap = await db.collection(MENU_COLLECTION).orderBy('order', 'asc').get();
    }catch(e){
      productsSnap = await db.collection(MENU_COLLECTION).get();
    }

    const settings = settingsSnap.exists ? settingsSnap.data() : {};
    const products = productsSnap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

    if(!settingsSnap.exists && products.length === 0) return null;

    return {
      note: settings.note || '',
      pass: settings.pass || DEFAULT_PASS,
      products
    };
  },

  async set(data){
    const batch = db.batch();

    batch.set(db.collection('menuSettings').doc('main'), {
      note: data.note || '',
      pass: data.pass || DEFAULT_PASS,
      updatedAt: Date.now()
    }, { merge: true });

    const existing = await db.collection(MENU_COLLECTION).get();
    const wanted = new Set(data.products.map(p => p.id));

    existing.forEach(d => {
      if(!wanted.has(d.id)) batch.delete(d.ref);
    });

    data.products.forEach((p, index) => {
      const id = p.id || crypto.randomUUID();
      batch.set(db.collection(MENU_COLLECTION).doc(id), {
        name: p.name || '',
        price: p.price || '',
        gram: p.gram || '',
        desc: p.desc || '',
        cat: p.cat || 'firin',
        img: p.img || '',
        order: index,
        updatedAt: Date.now()
      });
      p.id = id;
    });

    await batch.commit();
    return true;
  },

  async deleteProduct(id){
    await db.collection(MENU_COLLECTION).doc(id).delete();
  }
};

const uid = () => crypto.randomUUID();

    spyT = null;

let gallery = [], gi = 0;
function openLb(id){
  const i = gallery.findIndex(p=>p.id===id);
  if(i<0) return;
  gi = i; showLb();
  $('#lb').classList.add('on'); document.body.style.overflow='hidden';
}
function showLb(){
  const p = gallery[gi]; if(!p) return;
  $('#lbImg').src = p.img; $('#lbImg').alt = p.name;
  $('#lbT').textContent = p.name; $('#lbP').textContent = money(p.price);
  const many = gallery.length > 1;
  $('#lbPrev').style.display = many ? 'grid' : 'none';
  $('#lbNext').style.display = many ? 'grid' : 'none';
}
function closeLb(){ $('#lb').classList.remove('on'); document.body.style.overflow=''; }
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-img]');
  if(t) openLb(t.dataset.img);
});
document.addEventListener('keydown', e=>{
  const t = e.target.closest && e.target.closest('[data-img]');
  if(t && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); openLb(t.dataset.img); return; }
  if(!$('#lb').classList.contains('on')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowRight' && gallery.length>1){ gi=(gi+1)%gallery.length; showLb(); }
  if(e.key==='ArrowLeft' && gallery.length>1){ gi=(gi-1+gallery.length)%gallery.length; showLb(); }
});
$('#lbClose').onclick = closeLb;
$('#lbNext').onclick = ()=>{ gi=(gi+1)%gallery.length; showLb(); };
$('#lbPrev').onclick = ()=>{ gi=(gi-1+gallery.length)%gallery.length; showLb(); };
$('#lb').addEventListener('click', e=>{ if(e.target.id==='lb' || e.target.classList.contains('wrap')) closeLb(); });
let sx = 0;
$('#lb').addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; },{passive:true});
$('#lb').addEventListener('touchend', e=>{
  const d = e.changedTouches[0].clientX - sx;
  if(Math.abs(d) > 55 && gallery.length > 1){ gi = d < 0 ? (gi+1)%gallery.length : (gi-1+gallery.length)%gallery.length; showLb(); }
},{passive:true});

function bindImg(){
  const pick = $('#imgPick'), rm = $('#imgRm'), file = $('#fFile');
  if(pick) pick.onclick = ()=>file.click();
  if(rm) rm.onclick = ()=>{ formImg=''; $('#imgBox').innerHTML = imgBox(); bindImg(); };
  file.onchange = async ()=>{
    const f = file.files[0]; if(!f) return;
    toast('Fotoğraf işleniyor…');
    try{
      formImg = await shrink(f);
      $('#imgBox').innerHTML = imgBox();
      bindImg();
      toast('Fotoğraf hazır');
    }catch(err){
      console.error(err);
      toast('Fotoğraf okunamadı');
    }
    file.value = '';
  };
}
function shrink(file, max=800, q=.72){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{
      const im = new Image();
      im.onload = ()=>{
        let w = im.width, h = im.height;
        const s = Math.min(1, max/Math.max(w,h));
        w = Math.round(w*s); h = Math.round(h*s);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        res(cv.toDataURL('image/jpeg',q));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
async function saveProduct(){

  editingId = null; formImg = '';
  await save(); render(); openPane('list');
}

(async function init(){

    state = JSON.parse(JSON.stringify(SEED));
    render();
    const msg = e && e.code === 'permission-denied'
      ? 'Firestore erişim engellendi. Kurallarda okumaya izin verin.'
      : 'Firebase verileri okunamadı. Firestore kurallarını kontrol edin.';
    toast(msg);
  }

  auth.onAuthStateChanged(user=>{
    if(!user) authed = false;
  });

  document.documentElement.style.setProperty('--strip-h', stripEl.offsetHeight + 'px');

  const intro = $('#intro');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    intro.classList.add('done');
    setTimeout(()=>intro.remove(), 600);
  }, reduce ? 200 : 1000);
})();
</script>
</body>
</html>
